<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#0f172a"/>

  <!-- Inner accent ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#38bdf8" stroke-width="12" opacity="0.3"/>

  <!-- Game controller / quiz icon — stylised "Q" with a tick -->
  <!-- Outer Q ring -->
  <circle cx="256" cy="240" r="120" fill="none" stroke="#38bdf8" stroke-width="28"/>

  <!-- Q tail -->
  <line x1="340" y1="320" x2="390" y2="375" stroke="#38bdf8" stroke-width="28" stroke-linecap="round"/>

  <!-- Tick / check inside the Q -->
  <polyline points="198,240 236,278 314,200" fill="none" stroke="#4ade80" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
